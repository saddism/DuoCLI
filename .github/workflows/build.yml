name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DUOCLI_SCRCPY_VERSION: '4.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install setuptools
      - run: npm install
      - name: Prepare scrcpy server
        shell: bash
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-server-v4.1 \
            --output vendor/scrcpy-server
          node -e "const fs=require('node:fs'),crypto=require('node:crypto');const expected='deacb991ed2509715160ffdc7907e47b4160eb30d1566217e9047fd5b8850cae';const actual=crypto.createHash('sha256').update(fs.readFileSync('vendor/scrcpy-server')).digest('hex');if(actual!==expected){console.error('scrcpy-server SHA-256 mismatch');process.exit(1)}"
      - run: npm run build:ts
      - run: npm run copy:html
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: release/*.dmg

  build-win:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DUOCLI_SCRCPY_VERSION: '4.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install setuptools
      - run: npm install
      - name: Prepare scrcpy server
        shell: bash
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-server-v4.1 \
            --output vendor/scrcpy-server
          node -e "const fs=require('node:fs'),crypto=require('node:crypto');const expected='deacb991ed2509715160ffdc7907e47b4160eb30d1566217e9047fd5b8850cae';const actual=crypto.createHash('sha256').update(fs.readFileSync('vendor/scrcpy-server')).digest('hex');if(actual!==expected){console.error('scrcpy-server SHA-256 mismatch');process.exit(1)}"
      - run: npm run build:ts
      - run: npm run copy:html
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: release/*.exe

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: win-build
          path: artifacts/win
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
          body: |
            ## DuoCLI v1.2.1 — 一个窗口，随手管理常用的 AI CLI

            **不在多个终端窗口之间找 AI。** DuoCLI 把 Claude Code、Codex、Gemini、Kimi、Cursor、Kiro、QoderCN、OpenCode、Antigravity 等常用 CLI 放进一个轻量桌面工作区。

            **这次更新：**
            - 普通会话不再受 4 个可见分屏限制，想开几个开几个
            - 会话切换像切换标签一样简单；只有点击拆分按钮才增加可见分屏
            - 保留最多 4 个清晰分屏，重要任务可以并行对照
            - 修复旧 Pane 布局导致启动中断、无法新建终端的问题
            - AI 配置用途更清楚：整理会话历史、生成对话标题，不参与终端命令执行

            **DuoCLI 的核心体验：**
            - 🧭 一个侧边栏管理多个 CLI 和多个工作目录
            - 🎨 标题、颜色、运行状态一眼区分
            - 📱 手机远程查看和操控桌面端终端
            - 🔄 关闭会话后可从列表恢复

            **安装说明：**

            **macOS 用户：** 下载 `.dmg` 文件，打开后拖入 Applications。首次打开如提示“无法验证开发者”，右键点击应用 → 打开即可。

            **Windows 用户：** 下载 `.exe` 安装包，双击安装。如弹出 SmartScreen 警告，点击“更多信息” → “仍要运行”。

            完整更新说明：[v1.2.1 Release Notes](https://github.com/saddism/DuoCLI/blob/main/docs/updates/v1.2.1-release-notes.md)
